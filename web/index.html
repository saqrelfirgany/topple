  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Topple — a 2D bow-and-arrow knock-down physics game. Draw the bow, loose the arrow, and topple the targets across 13 hand-built levels. Built with Flutter, Flame and Forge2D.">
  <meta name="theme-color" content="#0E1A2F">

  <!-- Open Graph / link preview -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Topple — a 2D archery physics game">
  <meta property="og:description" content="Draw the bow, loose the arrow, and topple the targets. 13 levels of Flutter + Flame + Forge2D physics.">
  <meta property="og:image" content="https://saqrelfirgany.github.io/topple/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://saqrelfirgany.github.io/topple/">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Topple — a 2D archery physics game">
  <meta name="twitter:description" content="Draw the bow, loose the arrow, and topple the targets. 13 levels of Flutter + Flame + Forge2D physics.">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Topple">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Topple — 2D archery physics game</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0E1A2F; overflow: hidden; }
    #loading {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(#1E4074, #0B1730);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      transition: opacity .45s ease;
    }
    #loading .logo {
      color: #fff; font-size: 46px; font-weight: 900; letter-spacing: 6px;
      text-shadow: 0 6px 24px rgba(0,0,0,.4);
    }
    #loading .sub { color: #9fb3cf; font-size: 14px; margin-top: 8px; letter-spacing: .5px; }
    #loading .spin {
      margin-top: 26px; width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.18); border-top-color: #54C5F8;
      animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="logo">TOPPLE</div>
    <div class="sub" id="load-sub">loading…</div>
    <div class="spin" id="load-spin"></div>
  </div>
  <script>
    function hideLoading() {
      var l = document.getElementById('loading');
      if (l) {
        l.style.opacity = '0';
        setTimeout(function () { if (l && l.parentNode) l.parentNode.removeChild(l); }, 500);
      }
    }
    // Surface a startup crash on screen instead of spinning forever.
    function showLoadError(msg) {
      var sub = document.getElementById('load-sub');
      var spin = document.getElementById('load-spin');
      if (spin) spin.style.display = 'none';
      if (sub) {
        sub.textContent = 'Startup error: ' + String(msg).slice(0, 320);
        sub.style.color = '#ff9c9c';
        sub.style.maxWidth = '82vw';
      }
    }
    window.addEventListener('flutter-first-frame', hideLoading);
    window.addEventListener('error', function (e) {
      showLoadError((e && (e.message || (e.error && e.error.message))) || 'unknown error');
    });
    window.addEventListener('unhandledrejection', function (e) {
      showLoadError('promise: ' + (e && e.reason && (e.reason.message || e.reason)));
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
